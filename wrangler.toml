# Cloudflare Pages project config for the xerj marketing site + Functions.
#
# Bindings:
#   LEADS    — functions/lead.js writes captured emails here.
#   INSTALLS — functions/get.js writes one record per /get, /get.ps1 request.
#              No IP, no cookie, no identifier: see the privacy header in
#              functions/get.js. The bucket must be created once in the
#              Cloudflare dashboard (R2 → Create bucket → `xerj-installs`);
#              until it exists the function serves the installer normally and
#              simply does not count. Fail-open is deliberate.
#   FIELD_REPORTS (Workers KV) — functions/api/field-report.js stores each
#              accepted agent field report as a small JSON value. This is the
#              GitHub-unavailable FALLBACK to `xerj feedback --open-pr`; the
#              PR path stays primary. KV only — NEVER R2 (R2 is frozen by
#              owner order). The namespace id is not committed. Deploy looks
#              it up (secret, then title FIELD_REPORTS, then create) and
#              injects the binding for that run only. Until that succeeds the
#              binding is omitted and the function accepts requests but does
#              not store (fail-open, like get.js). The owner sets the id:
#                  wrangler kv namespace create FIELD_REPORTS
#              then the GitHub secret FIELD_REPORTS_KV_NAMESPACE_ID. Do not
#              commit the id. A stand-in id fails .github/scripts/deploy_guard.sh.
#
# Routing: landing/_routes.json pins Function invocation to /get, /get.ps1,
# /lead and /api/field-report. A NEW FUNCTION ADDED UNDER functions/ WILL NOT
# BE ROUTED until its path is added to that include list.
name = "xerj"
pages_build_output_dir = "landing"
compatibility_date = "2024-09-01"

[[r2_buckets]]
binding = "LEADS"
bucket_name = "xerj-leads"

[[r2_buckets]]
binding = "INSTALLS"
bucket_name = "xerj-installs"

# Workers KV for agent field reports (functions/api/field-report.js).
# The namespace id is not committed. Deploy
# (.github/scripts/resolve-field-reports-kv.sh) fills it in for that run only:
#   1. GitHub secret FIELD_REPORTS_KV_NAMESPACE_ID, if the owner set it
#   2. else `wrangler kv namespace list`, matched by title FIELD_REPORTS
#   3. else `wrangler kv namespace create FIELD_REPORTS` when the token can
# If none of those yield a 32-hex id, the binding is left off and the site
# still deploys. The function then accepts reports and does not store them
# (fail-open, same as get.js without its bucket).
# The owner must create the namespace and set FIELD_REPORTS_KV_NAMESPACE_ID
# (or grant this token Workers KV edit) before reports are stored.
# Do not uncomment a placeholder id. `wrangler pages deploy` rejects one with
# Error 8000022 and that blocks every xerj.org deploy (#1769). A committed
# stand-in id is also rejected by .github/scripts/deploy_guard.sh.
